  background           : #f2f1ee;
  font-family          : ui-monospace, monospace;
  font-variant-numeric : tabular-nums;
}

.the-gap-band { fill: #bdd5e8; }

.the-gap-edge {
  stroke       : #1a1a1a;
  stroke-width : 1.2;
}

.the-gap-tie {
  stroke           : #5c5c58;
  stroke-dasharray : 2 3;
  stroke-width     : 1;
}

.the-gap-halo, .the-gap-reading {
  fill            : none;
  stroke-linecap  : round;
  stroke-linejoin : round;
}

.the-gap-halo {
  stroke       : #f2f1ee;
  stroke-width : 6;
}

.the-gap-reading {
  stroke       : #5069ad;
  stroke-width : 2;
}

.the-gap-on {
  fill         : #b2cfe6;
  stroke       : #1a1a1a;
  stroke-width : 1.2;
}

.the-gap-off {
  stroke       : #5c5c58;
  stroke-width : 1.2;
}

.the-gap-ring {
  fill         : #f2f1ee;
  stroke       : #1a1a1a;
  stroke-width : 1.5;
}

.the-gap-chip {
  fill         : #e7e6e2;
  stroke       : #d5d4d0;
  stroke-width : 1;
}

.the-gap-word, .the-gap-figure { font-size: 11px; }

.the-gap-word { fill: #5c5c58; }

.the-gap-figure { fill: #1a1a1a; }

.the-gap-chip-name {
  fill           : #1a1a1a;
  font-size      : 10px;
  font-weight    : 600;
  letter-spacing : 0.08em;
  text-transform : uppercase;
}

.the-gap-count {
  fill        : #1a1a1a;
  font-weight : 600;
}

@media (prefers-color-scheme: dark) {
  .the-gap-drawing { background: #1a1a1a; }

  .the-gap-band { fill: #475f73; }

  .the-gap-edge, .the-gap-on, .the-gap-ring { stroke: #f2f1ee; }

  .the-gap-tie, .the-gap-off { stroke: #a6a6a1; }

  .the-gap-halo { stroke: #1a1a1a; }

  .the-gap-on { fill: #506e87; }

  .the-gap-ring { fill: #1a1a1a; }

  .the-gap-chip {
    fill   : #262624;
    stroke : #3d3d3b;
  }

  .the-gap-word { fill: #a6a6a1; }

  .the-gap-figure, .the-gap-chip-name, .the-gap-count { fill: #f2f1ee; }
}
