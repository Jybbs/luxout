  background           : #f2f1ee;
  font-family          : ui-monospace, monospace;
  font-variant-numeric : tabular-nums;
}

.twilight-bridge-wash { fill: #dddae7; }

.twilight-bridge-sky { fill: #ecd882; }

.twilight-bridge-grid {
  stroke       : #d5d4d0;
  stroke-width : 1;
}

.twilight-bridge-axis {
  fill         : none;
  stroke       : #5c5c58;
  stroke-width : 1;
}

.twilight-bridge-roof {
  stroke       : #746ca8;
  stroke-width : 2;
}

.twilight-bridge-cut {
  stroke           : #746ca8;
  stroke-dasharray : 3 3;
  stroke-width     : 1.25;
}

.twilight-bridge-edge {
  fill            : none;
  stroke          : #1a1a1a;
  stroke-linejoin : round;
  stroke-width    : 1.5;
}

.twilight-bridge-drop {
  fill             : none;
  stroke           : #1a1a1a;
  stroke-dasharray : 2 3;
  stroke-width     : 1;
}

.twilight-bridge-word, .twilight-bridge-end, .twilight-bridge-caps {
  dominant-baseline : central;
  font-size         : 11px;
}

.twilight-bridge-word { fill: #5c5c58; }

.twilight-bridge-end {
  fill        : #1a1a1a;
  font-weight : 600;
}

.twilight-bridge-caps {
  fill           : #1a1a1a;
  font-weight    : 500;
  letter-spacing : 0.1em;
}

.twilight-bridge-node { fill: #1a1a1a; }

.twilight-bridge-sun {
  fill         : #e8c840;
  stroke       : #1a1a1a;
  stroke-width : 1.5;
}

@media (prefers-color-scheme: dark) {
  .twilight-bridge-drawing { background: #1a1a1a; }

  .twilight-bridge-wash { fill: #373548; }

  .twilight-bridge-sky { fill: #77682b; }

  .twilight-bridge-grid { stroke: #3d3d3b; }

  .twilight-bridge-axis { stroke: #a6a6a1; }

  .twilight-bridge-roof { stroke: #9f97d2; }

  .twilight-bridge-cut { stroke: #9f97d2; }

  .twilight-bridge-edge { stroke: #f2f1ee; }

  .twilight-bridge-drop { stroke: #f2f1ee; }

  .twilight-bridge-word { fill: #a6a6a1; }

  .twilight-bridge-end { fill: #f2f1ee; }

  .twilight-bridge-caps { fill: #f2f1ee; }

  .twilight-bridge-node { fill: #f2f1ee; }

  .twilight-bridge-sun { stroke: #f2f1ee; }
}
</style></svg>
