["@homebridge/hap-nodejs"]
follows = "homebridge"
reason  = "Moves to the release `homebridge` names, since a second copy fails `tsc`"

["@types/node"]
reason = "Stays on the oldest Node line `engines` admits, so `tsc` rejects a newer API"

["rolldown"]
follows = "vite"
reason  = "Moves to the release `vite` names, since a second copy fails the suite reading each `tsconfig.json`"

["strip-json-comments"]
follows = "knip"
reason  = "Moves to the release `knip` names, so `bun.lock` keeps one copy"

["unbash"]
reason = "Release 5.1.0 adds an `unexpected token` error on an unclosed `case`, changing what the shell audit reports"
