min_version = "2026.11.9"

[env]
AUDIT_IGNORE = "GHSA-fc5q-39xc-vjpf" # ReDoS in `picomatch`, reached only by dev tooling, with no release fixing it
_.path       = ".mise/bin"

[settings]
auto_install = false
locked       = true

[tool_config]
locked = true

[tools]
bun       = "1.4.4"
gh        = "2.104.0"
jq        = "1.8.2"
lychee    = "0.24.2"
node      = "26.13.1"
watchexec = "2.8.0"
zizmor    = "1.32.0"
