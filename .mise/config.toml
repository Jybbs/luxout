min_version = "2026.11.9"

[doctor.checks.tools]
description = "Every tool `.mise/config.toml` pins is installed, since a task otherwise runs whatever release of that tool the machine's `PATH` holds"
hint        = "Run `mise install` from the repository root."
run         = 'test -z "$(mise ls --missing --no-global --no-header)"'

[env]
COVERAGE_FLOOR            = "95"
NPM_CONFIG_IGNORE_SCRIPTS = "true"
_.path                    = ".mise/bin"

[settings]
auto_install = false
locked       = true

[tool_config]
locked = true

[tools]
bun       = "1.4.4"
gh        = "2.104.0"
jq        = "1.8.2"
lychee    = "0.24.2"
node      = "26.13.1"
watchexec = "2.8.0"
zizmor    = "1.32.0"
