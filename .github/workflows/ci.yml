name: 🔆 CI

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name            : ${{ matrix.task }}
    runs-on         : ubuntu-26.04
    timeout-minutes : 15

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the row's tools
        uses : $/.github/actions/provision
        with:
          tools: ${{ matrix.tools }}

      - name : Run the row's task
        run  : mise run "$TASK"
        env:
          TASK: ${{ matrix.task }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - task  : lock:check
            tools : bun

          - task  : plugin:build
            tools : bun node

          - task  : plugin:cover
            tools : bun jq node

          - task  : plugin:lint
            tools : bun node

          - task  : plugin:pack
            tools : bun jq node

          - task  : plugin:scour
            tools : bun node

          - task  : plugin:test:22
            tools : bun jq node@22.23.3

          - task  : plugin:test:24
            tools : bun jq node@24.21.0

          - task  : plugin:typecheck
            tools : bun node

          - task  : repo:audit
            tools : bun node

          - task  : repo:lint:workflows
            tools : zizmor

  brief:
    name            : 🪁 Brief
    if              : always()
    runs-on         : ubuntu-26.04
    timeout-minutes : 5

    needs:
      - check

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the gate's tools
        uses : $/.github/actions/provision
        with:
          tools: jq

      - name : Render the run's brief
        run  : mise run gha:brief
        env:
          NEEDS: ${{ toJSON(needs) }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
