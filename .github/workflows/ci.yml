name: 🔆 CI

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name            : ${{ matrix.name }}
    runs-on         : ubuntu-26.04
    timeout-minutes : 15

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the row's tools
        uses : $/.github/actions/provision
        with:
          tools: ${{ matrix.tools }}

      - name : mise run ${{ matrix.task }}
        run  : mise run "$TASK"
        env:
          TASK: ${{ matrix.task }}

      - name : Upload the plugin's coverage report
        if   : ${{ !cancelled() && matrix.task == 'plugin:cover' }}
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files : true
          name                 : plugin-cover
          path                 : .cache/coverage

      - name : Upload the site's coverage report
        if   : ${{ !cancelled() && matrix.task == 'site:cover' }}
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files : true
          name                 : site-cover
          path                 : .cache/site/coverage

    strategy:
      fail-fast: false

      matrix:
        include:
          - name  : ❄️ Lockfile
            task  : lock:check
            tools : bun

          - name  : 🗜️ Build
            task  : plugin:build
            tools : bun node

          - name  : ☀️ Suite
            task  : plugin:cover
            tools : bun jq node

          - name  : 🐂 Oxlint
            task  : plugin:lint
            tools : bun node

          - name  : 📦 Pack
            task  : plugin:pack
            tools : bun jq node

          - name  : 🕸️ Unused
            task  : plugin:scour
            tools : bun node

          - name  : 🕯️ Node 22
            task  : plugin:test:22
            tools : bun jq node@22.23.3

          - name  : 💡 Node 24
            task  : plugin:test:24
            tools : bun jq node@24.21.0

          - name  : 🚩 Types
            task  : plugin:typecheck
            tools : bun node

          - name  : 🔭 Audit
            task  : repo:audit
            tools : bun node

          - name  : 🗝️ Workflows
            task  : repo:lint:workflows
            tools : zizmor

          - name  : ☂️ Coverage
            task  : site:cover
            tools : bun node

          - name  : 🧶 Lint
            task  : site:lint
            tools : bun node

          - name  : 🍂 Cruft
            task  : site:scour
            tools : bun node

          - name  : 🚩 Types
            task  : site:typecheck
            tools : bun node

  press:
    name            : ⛓️ Links
    runs-on         : ubuntu-26.04
    timeout-minutes : 15

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the press job's tools
        uses : $/.github/actions/provision
        with:
          tools: bun lychee node

      - name : Build the site and check its links
        run  : mise run site:linkcheck

  brief:
    name            : ✨ Reading
    if              : always()
    runs-on         : ubuntu-26.04
    timeout-minutes : 5

    needs:
      - check
      - press

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the gate's tools
        uses : $/.github/actions/provision
        with:
          tools: jq

      - name : Render the run's brief
        run  : mise run gha:brief
        env:
          NEEDS: ${{ toJSON(needs) }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
