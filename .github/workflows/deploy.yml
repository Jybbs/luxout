name: 🔆 Deploy

concurrency:
  group : ${{ github.workflow }}-${{ github.ref }}
  queue : max

jobs:
  press:
    name            : 🎞️ Press
    runs-on         : ubuntu-26.04
    timeout-minutes : 15

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the press job's tools
        uses : $/.github/actions/provision
        with:
          tools: bun lychee node

      - name : Build the site and check its links
        run  : mise run site:linkcheck

      - name : Upload the bundle
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found : error
          name              : bundle
          path              : site/.vitepress/dist

  deploy:
    name            : 🪁 Deploy
    runs-on         : ubuntu-26.04
    timeout-minutes : 10

    needs:
      - press

    steps:
      - name : Download the bundle
        uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name : bundle
          path : bundle

      - name : Publish the bundle to Cloudflare Pages
        uses : cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId       : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken        : ${{ secrets.CLOUDFLARE_TOKEN }}
          command         : pages deploy bundle --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --project-name=luxout
          wranglerVersion : 4.151.1

  brief:
    name            : ✨ Reading
    if              : always()
    runs-on         : ubuntu-26.04
    timeout-minutes : 5

    needs:
      - deploy
      - press

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the gate's tools
        uses : $/.github/actions/provision
        with:
          tools: jq

      - name : Render the run's brief
        run  : mise run gha:brief
        env:
          NEEDS: ${{ toJSON(needs) }}

on:
  push:
    branches:
      - main

    paths:
      - .github/actions/provision/**
      - .github/workflows/deploy.yml
      - package.json
      - site/**

  workflow_dispatch:

permissions:
  contents: read
