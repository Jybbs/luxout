name: 🔆 Release

jobs:
  pack:
    name            : Pack the package
    runs-on         : ubuntu-26.04
    timeout-minutes : 15

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the job's tools
        uses : $/.github/actions/provision
        with:
          tools: bun jq node

      - name : Hold the version to the release's tag
        run  : mise run gha:match

      - name : Pack the package
        run  : mise run plugin:pack

      - name : Upload the tarball
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found : error
          name              : tarball
          path              : '*.tgz'

  publish:
    name            : Publish to npm
    runs-on         : ubuntu-26.04
    timeout-minutes : 10

    environment:
      name : release
      url  : https://www.npmjs.com/package/homebridge-luxout

    needs:
      - pack

    permissions:
      contents : read
      id-token : write

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Download the tarball
        uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tarball

      - name : Provision Node
        uses : $/.github/actions/provision
        with:
          tools: node

      - name : Publish the tarball
        run  : npm publish ./*.tgz

  brief:
    name            : 🪁 Brief
    if              : always()
    runs-on         : ubuntu-26.04
    timeout-minutes : 5

    needs:
      - pack
      - publish

    steps:
      - name : Check out the repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name : Provision the gate's tools
        uses : $/.github/actions/provision
        with:
          tools: jq

      - name : Render the run's brief
        run  : mise run gha:brief
        env:
          NEEDS: ${{ toJSON(needs) }}

on:
  release:
    types:
      - published

permissions:
  contents: read
