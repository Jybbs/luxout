name        : Provision
description : Install the mise release `min_version` names, then the tools a job reads at the releases `.mise/mise.lock` records, then run the readiness checks `.mise/config.toml` declares for the programs it pins no release of

inputs:
  tools:
    description : The tools `mise install` installs, separated by spaces, each as `.mise/config.toml` names it or as `<tool>@<release>`
    required    : true

runs:
  using: composite

  steps:
    - name  : Read the mise release `min_version` names
      id    : mise
      shell : bash
      run   : |
        version=$(yq --exit-status --input-format toml --output-format yaml '.min_version' .mise/config.toml)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name : Install mise and the job's tools
      uses : jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
      with:
        cache        : 'false'
        install_args : ${{ inputs.tools }}
        version      : ${{ steps.mise.outputs.version }}

    - name  : Run each readiness check but `tools`, which a job installing only the tools it reads fails
      shell : bash
      run   : |
        mise doctor project --json > "$RUNNER_TEMP/doctor.json" || true
        jq --raw-output \
          '[.errors[], (.checks[] | select(.name != "tools" and .status != "pass" and .status != "skipped")
            | "\(.name): \(.hint)")]
            | map("::error::" + tostring)
            | if length > 0 then join("\n") + "\n" | halt_error(1) else empty end' \
          "$RUNNER_TEMP/doctor.json"
